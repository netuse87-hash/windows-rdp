name: Windows-RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Initialize RDP and Ngrok
        shell: powershell
        run: |
          # 1. Enable RDP
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0

          # 2. Setup User
          cmd /c "net user runneradmin Tally@12345678 /add /y"
          cmd /c "net localgroup administrators runneradmin /add"

          # 3. Download & Configure Ngrok
          Invoke-WebRequest -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile "ngrok.zip"
          Expand-Archive -Path "ngrok.zip" -DestinationPath "C:\ngrok" -Force
          C:\ngrok\ngrok.exe config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

          # 4. Start Tunnel
          Start-Process -FilePath "C:\ngrok\ngrok.exe" -ArgumentList "tcp 3389"
          Start-Sleep -Seconds 5

          # 5. Print Endpoint to Log
          $response = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels"
          $publicUrl = $response.tunnels[0].public_url -replace 'tcp://', ''
          Write-Host "=========================================="
          Write-Host "CONNECT TO THIS IP IN RD CLIENT: $publicUrl"
          Write-Host "Username: runneradmin"
          Write-Host "Password: Tally@12345678"
          Write-Host "=========================================="

          # 6. Keep Session Alive
          for ($i = 0; $i -lt 360; $i++) {
              Start-Sleep -Seconds 60
              Write-Host "VM Running: $i min"
          }
