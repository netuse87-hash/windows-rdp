name: Windows-RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Initialize RDP and Ngrok
        shell: powershell
        run: |
          # 1. Enable RDP & Firewall
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0

          # 2. Create User
          cmd /c "net user runneradmin Tally@12345678 /add /y"
          cmd /c "net localgroup administrators runneradmin /add"

          # 3. Download & Configure Ngrok
          Invoke-WebRequest -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile "ngrok.zip"
          Expand-Archive -Path "ngrok.zip" -DestinationPath "C:\ngrok" -Force
          C:\ngrok\ngrok.exe config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

          # 4. Start Ngrok as Background Process
          Start-Process -FilePath "C:\ngrok\ngrok.exe" -ArgumentList "tcp 3389"

          # 5. Keep Session Alive
          Write-Host "RDP is online. Fetch IP from Ngrok Dashboard -> Endpoints."
          for ($i = 0; $i -lt 360; $i++) {
              Start-Sleep -Seconds 60
              Write-Host "Heartbeat: VM running for $i minutes..."
          }
