name: Windows-RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Setup Remote Desktop & Tunnel
        shell: powershell
        run: |
          # 1. Enable RDP & Adjust Security Layer
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0

          # 2. Reset password cleanly
          $pass = ConvertTo-SecureString "Tally@12345678" -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $pass

          # 3. Download Pinggy CLI (Official Zero-Card Windows Binary)
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/Pinggy-io/pinggy-cli/main/install_windows.bat" -OutFile "install_pinggy.bat"
          cmd /c install_pinggy.bat

          # 4. Start Pinggy TCP tunnel and output URL to file
          Start-Process -FilePath "pinggy" -ArgumentList "tcp --forward localhost:3389 --json" -RedirectStandardOutput "tunnel.log" -RedirectStandardError "tunnel_err.log"

          # 5. Extract and print public connection URL
          $connected = $false
          for ($i = 1; $i -le 15; $i++) {
              Start-Sleep -Seconds 2
              if (Test-Path "tunnel.log") {
                  $log = Get-Content "tunnel.log" -Raw
                  if ($log -match '"url":"([^"]+)"') {
                      $url = $matches[1] -replace 'tcp://', ''
                      Write-Host ""
                      Write-Host "=========================================="
                      Write-Host ">>> CONNECT TO THIS IP IN RD CLIENT: $url"
                      Write-Host ">>> USERNAME: runneradmin"
                      Write-Host ">>> PASSWORD: Tally@12345678"
                      Write-Host "=========================================="
                      Write-Host ""
                      $connected = $true
                      break
                  }
              }
          }

          if (-not $connected) {
              # Fallback direct SSH tunnel banner read
              $sshOutput = Start-Process -FilePath "ssh" -ArgumentList "-o StrictHostKeyChecking=no -p 443 -R0:localhost:3389 a.pinggy.io" -PassThru -NoNewWindow
          }

          # 6. Keep session alive for 6 hours
          for ($m = 0; $m -lt 360; $m++) {
              Start-Sleep -Seconds 60
              Write-Host "Heartbeat: VM running for $m minutes..."
          }
