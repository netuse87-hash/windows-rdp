name: Windows-RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Initialize RDP and Free Tunnel
        shell: powershell
        run: |
          # 1. Enable RDP & Configure User
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          cmd /c "net user runneradmin Tally@12345678 /add /y"
          cmd /c "net localgroup administrators runneradmin /add"

          # 2. Download and Run Pinggy (100% Free TCP Tunnel)
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/nd-phuc/windows-rdp/main/pinggy.bat" -OutFile "pinggy.bat"
          
          Write-Host "=========================================="
          Write-Host "STARTING FREE TCP TUNNEL..."
          Write-Host "=========================================="
          
          # Start SSH tunnel to Pinggy on port 3389
          cmd /c "ssh -p 443 -R0:localhost:3389 -o StrictHostKeyChecking=no -o ServerAliveInterval=30 tcp@free.pinggy.io"
